name: Commandry release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commandry-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Source and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Check source, contracts, workflow and action formatting
        run: |
          pnpm check
          pnpm exec prettier --check '.github/**/*.yml'
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  unit:
    name: Unit and local tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - run: pnpm test

  integration:
    name: Populated upgrades and governed owner workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Exercise populated upgrades, built application and smoke paths
        run: |
          node --import tsx scripts/test-foundation-workflow-upgrade.mjs
          node --import tsx scripts/test-observatory-upgrade.mjs
          pnpm build
          pnpm test:smoke
      - name: Install browser for governed owner tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise governed owner workflows in disposable auth modes
        env:
          COMMANDRY_FOUNDATION_BROWSER: "1"
          COMMANDRY_FOUNDATION_BROWSER_ARTIFACTS: test-results/foundation-owner
        run: pnpm test:auth-smoke
      - name: Restore generated declaration and verify clean source
        run: |
          git restore -- apps/web/next-env.d.ts
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Retain owner workflow diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commandry-owner-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/foundation-owner/
          retention-days: 7
          if-no-files-found: warn

  image:
    name: Build and qualify exact image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image_id: ${{ steps.export.outputs.image_id }}
      archive_sha256: ${{ steps.export.outputs.archive_sha256 }}
      census_sha256: ${{ steps.export.outputs.census_sha256 }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Check production Compose configuration
        run: pnpm production:config:check
      - name: Build and start the exact candidate image
        run: pnpm compose:up
      - name: Rehearse production services with the exact image
        run: pnpm production:topology:rehearse
      - name: Report all high and critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: commandry-local:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/commandry-image-scan.json
          exit-code: "0"

      - name: Block fixable high and critical findings and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: commandry-local:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: ${{ runner.temp }}/commandry-image-gate.json
          exit-code: "1"

      - name: Summarize image findings without exposing matches
        if: always()
        env:
          IMAGE_SCAN: ${{ runner.temp }}/commandry-image-scan.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync(process.env.IMAGE_SCAN)) process.exit(0);
          const report = JSON.parse(fs.readFileSync(process.env.IMAGE_SCAN, 'utf8'));
          let high = 0;
          let critical = 0;
          let fixable = 0;
          let secrets = 0;
          for (const result of report.Results ?? []) {
            for (const finding of result.Vulnerabilities ?? []) {
              if (finding.Severity === 'HIGH') high++;
              if (finding.Severity === 'CRITICAL') critical++;
              if (finding.FixedVersion) fixable++;
            }
            secrets += (result.Secrets ?? []).length;
          }
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Production image scan\n\n- High: ${high}\n- Critical: ${critical}\n- Fixable high/critical: ${fixable}\n- Secret findings: ${secrets}\n- Unfixed findings are reported but do not block publication. A passing gate does not mean the image has no vulnerabilities.\n\n`
          );
          NODE

      - name: Export the qualified candidate and selected-source browser census
        id: export
        run: node scripts/ci-release.mjs export "$RUNNER_TEMP/commandry-image"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commandry-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/commandry-image/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Stop disposable local Compose services
        if: always()
        shell: bash
        run: |
          if command -v pnpm >/dev/null && test -f .env.local; then
            pnpm compose:down
          fi

  browser:
    name: Browser shard ${{ matrix.shard }}/6
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CI: "true"
      CI_EXPECTED_IMAGE_ID: ${{ needs.image.outputs.image_id }}
      CI_EXPECTED_ARCHIVE_SHA256: ${{ needs.image.outputs.archive_sha256 }}
      CI_EXPECTED_CENSUS_SHA256: ${{ needs.image.outputs.census_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: commandry-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/commandry-image
      - name: Verify and start the already built image in this isolated stack
        run: node scripts/ci-release.mjs start "$RUNNER_TEMP/commandry-image"
      - name: Exercise this shard with one browser worker and no retries
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser-results.json
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e --workers=1 --shard=${{ matrix.shard }}/6 --reporter=line,json
      - name: Verify healthy tested image and clean source after browser tests
        run: node scripts/ci-release.mjs verify "$RUNNER_TEMP/commandry-image"
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commandry-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: error
      - name: Stop disposable local Compose services
        if: always()
        shell: bash
        run: |
          if command -v pnpm >/dev/null && test -f .env.local; then
            pnpm compose:down
          fi

  qualify:
    name: Verify complete release coverage
    needs: [source, unit, integration, image, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"
      CI_EXPECTED_IMAGE_ID: ${{ needs.image.outputs.image_id }}
      CI_EXPECTED_ARCHIVE_SHA256: ${{ needs.image.outputs.archive_sha256 }}
      CI_EXPECTED_CENSUS_SHA256: ${{ needs.image.outputs.census_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: commandry-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/commandry-image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: commandry-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-shard-*
          path: ${{ runner.temp }}/commandry-reports
      - name: Require every selected-source test identity and the reviewed skips
        run: node scripts/ci-release.mjs census "$RUNNER_TEMP/commandry-image" "$RUNNER_TEMP/commandry-reports"
      - name: Retain complete qualification census
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commandry-qualification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/commandry-reports/browser-summary.json
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish qualified main image
    if: github.ref == 'refs/heads/main'
    needs: [image, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      CI: "true"
      CI_EXPECTED_IMAGE_ID: ${{ needs.image.outputs.image_id }}
      CI_EXPECTED_ARCHIVE_SHA256: ${{ needs.image.outputs.archive_sha256 }}
      CI_EXPECTED_CENSUS_SHA256: ${{ needs.image.outputs.census_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: commandry-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/commandry-image
      - name: Require the selected main source and the already qualified image
        run: |
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          node scripts/ci-release.mjs load "$RUNNER_TEMP/commandry-image"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and read back the tested image by digest
        shell: bash
        run: |
          set -euo pipefail
          source_image="commandry-local:${GITHUB_SHA}"
          source_id="$(docker image inspect "$source_image" --format '{{.Id}}')"
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/commandry"
          tag="${repository}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker image tag "$source_image" "$tag"
          docker push "$tag" | tee "$RUNNER_TEMP/commandry-push.log"
          digest="$(node -e 'const text=require("node:fs").readFileSync(process.argv[1],"utf8"); const matches=[...text.matchAll(/digest: (sha256:[0-9a-f]{64}) size:/g)]; if(matches.length!==1) process.exit(1); console.log(matches[0][1])' "$RUNNER_TEMP/commandry-push.log")"
          image_ref="${repository}@${digest}"
          docker pull "$image_ref" >/dev/null
          test "$(docker image inspect "$image_ref" --format '{{.Id}}')" = "$source_id"
          {
            echo '## Commandry release candidate'
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Verified image: \`${image_ref}\`"
            echo '- Validation: local checks, smoke tests, and synthetic production topology.'
            echo '- Deployment, offsite restore, Tunnel, and public ingress remain unverified.'
          } >> "$GITHUB_STEP_SUMMARY"
