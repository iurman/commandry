name: Browser safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Check browser version, sandbox and source policy
        run: node --test --test-reporter=tap tools/browser-safety/browser-safety.checks.mjs
